name: Deploy Northstar Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website
        run: rsync -a --exclude='/mia/' website/ "${{ runner.temp }}/northstar-site/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/northstar-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
